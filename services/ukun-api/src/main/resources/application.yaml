spring:
  application:
    name: ukun-api

  # Credentials come from the environment (compose.yaml injects SPRING_DATASOURCE_*); there is no
  # default here on purpose, so a misconfigured deployment fails at startup instead of silently
  # pointing somewhere else.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  # Liquibase owns the schema of ukun_app. No DDL in Postgres startup scripts: those only create
  # empty databases (skill `liquibase`, rule 3) — that is exactly what the legacy database/init.sql
  # got wrong, since it only ever runs on a virgin volume and is therefore no change history.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Never leave this unset. With no contexts configured Liquibase runs *every* changeset,
    # including the ones marked `context: demo` — so the default failure mode is not "the demo
    # data is missing", it is "production silently seeds itself with demo customers". Schema
    # changesets carry no context and therefore always apply, whichever value is active here.
    contexts: prod

  jpa:
    hibernate:
      # `validate`, never `create`/`update`: Hibernate checks the schema Liquibase created and
      # never authors it. There are no entities yet, so today it validates nothing — the setting
      # is here so the first entity of v0.3 is checked against the baseline from its first run.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Safety net, never the plan A (docs/03-analisis-y-patrones.md §2, reading ladder): a lazy
        # association that escapes its @EntityGraph is loaded for the whole batch instead of one row
        # at a time, so an overlooked N+1 costs a handful of queries rather than one per row. The
        # first three rungs — projection, @EntityGraph, fetch join — are still the ones that decide.
        default_batch_fetch_size: 50

ukun:
  catalog:
    # Public prefix product images are served from. `product.image_key` is a storage key and is never
    # exposed (docs/08-identidad-y-seguridad.md §9): the API composes a servable URL from it. /media/**
    # is a public route of the gateway serving static content, deliberately not an operation of the
    # OpenAPI contract.
    media-base-path: /media/products/

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        # Only health for now. Anything else is opt-in per release, never by default.
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # Swagger UI is a development tool, never exposed by the production profile.
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev

  # The catalogue, the stores, the stock and the demo accounts. compose.dev.yaml already sets
  # SPRING_PROFILES_ACTIVE=dev, so `tilt up` gets a populated database with no extra wiring.
  liquibase:
    contexts: demo

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        # /actuator/modulith prints the module structure and its dependencies, which is far easier
        # to read than the exception of a failing verify(). Development only (docs/14-modules.md §6).
        include: health,modulith
