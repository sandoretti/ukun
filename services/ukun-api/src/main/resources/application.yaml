spring:
  application:
    name: ukun-api

  # Credentials come from the environment (compose.yaml injects SPRING_DATASOURCE_*); there is no
  # default here on purpose, so a misconfigured deployment fails at startup instead of silently
  # pointing somewhere else.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  # Liquibase owns the schema of ukun_app. No DDL in Postgres startup scripts: those only create
  # empty databases (skill `liquibase`, rule 3) — that is exactly what the legacy database/init.sql
  # got wrong, since it only ever runs on a virgin volume and is therefore no change history.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Never leave this unset. With no contexts configured Liquibase runs *every* changeset,
    # including the ones marked `context: demo` — so the default failure mode is not "the demo
    # data is missing", it is "production silently seeds itself with demo customers". Schema
    # changesets carry no context and therefore always apply, whichever value is active here.
    contexts: prod

  security:
    oauth2:
      # This service is the final authorisation authority (docs/08-identidad-y-seguridad.md §4): it
      # validates the token itself and never trusts a header the gateway may have injected.
      resourceserver:
        jwt:
          # These two URIs name the same service on purpose, and the pair is the whole trap of this
          # slice. `iss` is what the *browser* sees, because the browser has to follow the redirect
          # to /oauth2/authorize, and it is compared as a literal string; the keys, on the other
          # hand, are fetched from inside the container network. Point `issuer-uri` at the container
          # name and every token is rejected; drop `jwk-set-uri` and Boot resolves the issuer by
          # discovery against `localhost:9000`, which from inside a container is this service.
          #
          # With both set, Boot builds the decoder from the JWKS (`jwtDecoderByJwkKeySetUri`) and
          # `issuer-uri` contributes only a JwtIssuerValidator — no discovery call is ever made.
          jwk-set-uri: ${UKUN_AUTH_JWK_SET_URI:http://ukun-auth:9000/oauth2/jwks}
          issuer-uri: ${UKUN_AUTH_ISSUER:http://localhost:9000}

          # Not validated by default, and the one check that stops a token minted for somebody else
          # from being accepted here. ukun-auth's TokenClaimsCustomizer sets `aud: ["ukun-api"]` on
          # the user token precisely so this line can exist.
          audiences: ukun-api

          # `roles: ["CUSTOMER"]` -> ROLE_CUSTOMER. The claim travels bare and the prefix belongs on
          # this side, which is where hasRole() expects it (docs/08 §4). Naming the claim also stops
          # `scope` from being mapped: roles are claims, not scopes, and authorisation here is by
          # role — the contract says so in its `bearerAuth` description.
          authorities-claim-name: roles
          authority-prefix: ROLE_

      # The other half of the boundary: this service calling ukun-auth's /internal/accounts through
      # AccountsPort. Machine to machine, no browser and no person involved — it mirrors the
      # RegisteredClient that ukun-auth's RegisteredClientSeeder.api(...) already registers.
      client:
        registration:
          ukun-auth:
            client-id: ukun-api
            # Empty default, unlike every other secret in this repo, and it is a considered
            # exception: with a bare placeholder the context fails to start, which would take down
            # the whole integration suite for a port nothing calls until the signup saga (#25)
            # lands. An empty secret is not a working one — ukun-auth rejects it — and
            # HttpAccountsAdapter refuses to issue a call while it is blank rather than letting a
            # 401 from the token endpoint surface as a mystery. Whoever wires the saga is the one
            # who should make this mandatory.
            client-secret: ${UKUN_OAUTH2_API_SECRET:}
            authorization-grant-type: client_credentials
            scope: accounts:write
        provider:
          ukun-auth:
            # The container name, not the issuer: nobody's browser takes part in this flow.
            token-uri: ${UKUN_AUTH_TOKEN_URI:http://ukun-auth:9000/oauth2/token}

  # The product image of RF-10 is the only multipart operation of this service, and this is one of the
  # two layers that limit it: the other is `ukun.gateway.max-body-size` in ukun-gateway, which cuts an
  # oversized request before it ever arrives. **The two values must stay equal** — defect #17 is
  # exactly that pair disagreeing (Spring said 10MB, nginx said nothing and therefore 1MB).
  # max-request-size is the same number and not larger: the request carries one part and nothing else,
  # so the two limits describe the same thing and a gap between them would only decide which of the
  # two messages the client gets.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    hibernate:
      # `validate`, never `create`/`update`: Hibernate checks the schema Liquibase created and
      # never authors it. There are no entities yet, so today it validates nothing — the setting
      # is here so the first entity of v0.3 is checked against the baseline from its first run.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Safety net, never the plan A (docs/03-analisis-y-patrones.md §2, reading ladder): a lazy
        # association that escapes its @EntityGraph is loaded for the whole batch instead of one row
        # at a time, so an overlooked N+1 costs a handful of queries rather than one per row. The
        # first three rungs — projection, @EntityGraph, fetch join — are still the ones that decide.
        default_batch_fetch_size: 50

ukun:
  catalog:
    # Public prefix product images are served from. `product.image_key` is a storage key and is never
    # exposed (docs/08-identidad-y-seguridad.md §9): the API composes a servable URL from it. /media/**
    # is a public route of the gateway serving static content, deliberately not an operation of the
    # OpenAPI contract.
    media-base-path: /media/products/

  storage:
    # Container side of the bind mount declared in compose.yaml, and the fix for defect #6: the legacy
    # carries this path hardcoded inside UploadFileServiceImpl. The `storage` module reads from here
    # and serves it under the prefix above; in v1.1 the adapter becomes object storage and this key
    # disappears with it (docs/04-roadmap.md).
    local-root: /opt/resources/uploads

  checkout:
    # La purga diaria que docs/10 §4 daba por supuesta al decidir que estas dos tablas no llevan
    # índice, y que hasta v1.0 no existía (ADR-0024, issue #118). Ver CheckoutPurgeJob.
    purge:
      # A una hora a la que nadie despliega, como el job equivalente de ukun-auth.
      cron: "0 45 3 * * *"
      # Dos ventanas porque son dos ciclos de vida. El intento caduca por su propia columna
      # `expires_at` (30 minutos, ADR-0016) y no necesita retención configurable: ya la lleva la fila.
      # La fila de idempotencia tiene que sobrevivir al reintento al que existe para responder, y
      # docs/11 (§retención) fija esa ventana en un día.
      idempotency-retention: P1D

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        # Only health for now. Anything else is opt-in per release, never by default.
        include: health
  endpoint:
    health:
      probes:
        enabled: true

  # Correlation across the three processes (docs/11-observabilidad-y-logging.md §5). Nothing here
  # exports a trace anywhere: what this buys is the traceId in the MDC, which the log pattern prints
  # and which shared/error/TraceIds hands to every ProblemDetail. The OTLP exporter is v1.0.
  tracing:
    sampling:
      # Boot's default is 0.1, which for this volume means nine out of ten requests are impossible to
      # follow across services — the exact problem this release exists to fix. docs/11 §5 sets 1.0
      # both locally and in production "while the volume is this one".
      probability: 1.0
    propagation:
      # Boot already *produces* W3C, but by default it *consumes* W3C, B3 and B3_MULTI. Narrowing it
      # to one format is deliberate: the only party that talks to this service is the gateway, it
      # sends `traceparent`, and accepting two more header dialects from anyone else is surface
      # nobody asked for.
      type: w3c

  # Y la exportación en sí, que es lo que v1.0 añade sobre lo anterior (docs/11 §5, fila de v1.0).
  #
  # Las dos propiedades que la encienden NO se declaran aquí, y la omisión es la configuración:
  #   management.opentelemetry.tracing.export.otlp.endpoint  -> MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
  #   management.otlp.metrics.export.url                     -> MANAGEMENT_OTLP_METRICS_EXPORT_URL
  # Sin la variable la propiedad no existe, no se instala exportador y el servicio arranca igual, que
  # es lo que tiene que pasar donde no hay colector. compose.dev.yaml las pone apuntando al de Tilt;
  # en producción salen del despliegue (ADR-0023, issue #55). Declararlas aquí con un default vacío
  # sería peor: la propiedad presente y sin URL es un exportador configurado contra ninguna parte.
  #
  # Los dos nombres se leen dos veces antes de escribirlos. Boot 4 movió el de trazas a
  # `management.opentelemetry.*` y dejó el de métricas en `management.otlp.*`, y escribir el nombre de
  # Boot 3.x no da error: la propiedad desconocida se ignora y no se exporta nada.
  #
  # Y dos interruptores que NO son afinado: son los dos defaults de Boot que exportarían solos.
  #
  # `management.otlp.metrics.export.enabled` viene a `true`, y cuando no hay URL Micrometer cae a la
  # suya, `http://localhost:4318/v1/metrics`. O sea: en cuanto micrometer-registry-otlp entró en el
  # classpath con el starter, este servicio empezaría a hacer POST a un puerto cerrado cada minuto —
  # en cada test, en cada `java -jar` y en cada PR de CI—, avisando de una conexión rechazada que
  # nadie relacionaría con este cambio. Se enciende donde hay colector (compose.dev.yaml) y en ningún
  # otro sitio. Las trazas no necesitan gemelo de esta línea: su exportador lleva
  # @ConditionalOnProperty sobre el endpoint, así que sin endpoint no se instala.
  #
  # Y los logs no salen por OTLP, que es una decisión y no un olvido: docs/11 §7 los deja en stdout y
  # el agregador es de ADR-0023. Boot los exportaría en cuanto alguien pusiera un endpoint —incluida
  # una variable OTEL_* del entorno, que gana a este fichero—, así que la decisión se escribe aquí en
  # vez de quedarse en el documento.
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

springdoc:
  # Swagger UI is a development tool, never exposed by the production profile.
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev

  # The catalogue, the stores, the stock and the demo accounts. compose.dev.yaml already sets
  # SPRING_PROFILES_ACTIVE=dev, so `tilt up` gets a populated database with no extra wiring.
  liquibase:
    contexts: demo

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        # /actuator/modulith prints the module structure and its dependencies, which is far easier
        # to read than the exception of a failing verify(). Development only (docs/14-modules.md §6).
        include: health,modulith

# El otro lado de la tabla de docs/11 §7. En desarrollo interesa lo contrario que en producción: el
# arranque se lee, y el código propio habla más que nadie.
#
# `dev.sandoretti.ukun` es el paquete —las clases—, distinto de los loggers `ukun.business` y
# `ukun.access`, que llevan nombre propio y no cuelgan de él. Y nada de SQL: docs/11 §7 lo deja
# apagado siempre, y para depurar una consulta se sube `org.hibernate.SQL` a mano y a ratos.
logging:
  level:
    root: INFO
    dev.sandoretti.ukun: DEBUG

---
# El formato de producción, en un documento `!dev` y no en un perfil `prod`.
#
# Lo de `!dev` en vez de `prod` es lo que ya hace el resto del fichero: el documento por defecto ES el
# de producción y `dev` releva lo que en desarrollo se quiere distinto (springdoc, los contexts de
# Liquibase). Un perfil `prod` obligaría además a activarlo en el despliegue, y hoy nadie lo activa.
#
# Lo que sí es una elección es tenerlo en documento aparte en vez de arriba con un `console: ""` en el
# documento `dev` —que funcionaría: DefaultLogbackConfiguration elige entre PatternLayoutEncoder y
# StructuredLogEncoder con StringUtils.hasLength(formato), así que la cadena vacía es exactamente «no
# estructurado», y es el mecanismo que usa la tanda de tests en ukun-java-conventions.gradle.kts—. Se
# prefiere el documento porque las dos propiedades de abajo tienen que ir juntas: la máscara de
# secretos solo actúa sobre el JSON, así que un formato activo sin su customizer es logging de
# producción sin la capa 3 de docs/11 §4, y ese es el fallo que nadie nota. Aquí no se pueden
# desalinear.
spring:
  config:
    activate:
      on-profile: "!dev"

logging:
  structured:
    format:
      # ECS y no `logstash`: nombra los campos igual que cualquier stack Elastic/OpenSearch al que se
      # envíen algún día e incluye el MDC en el JSON sin configuración adicional (docs/11 §5). Eso
      # último es la mitad del valor del diseño: los campos que BusinessEvents estampa en el MDC pasan
      # a ser campos JSON indexables sin tocar una línea de BusinessEvents.
      console: ecs
    json:
      # La cuarta capa de docs/11 §4. Solo aquí: en local un secreto mal logueado tiene que verse para
      # que se corrija, y este documento no se activa bajo `dev`.
      customizer: dev.sandoretti.ukun.api.shared.observability.SecretMaskingJsonCustomizer

  # Los niveles que docs/11 §7 promete para producción, que hasta ahora el documento afirmaba y el
  # código no cumplía. Lo que hacen juntos: apagar el ruido y dejar encendido exactamente lo que la
  # tabla de eventos de §3 emite, para que «solo lo que afecta al usuario» sea una configuración y no
  # una promesa. Por eso BusinessEvents tiene logger propio.
  #
  # `root: WARN` tiene una consecuencia que conviene saber antes de verla en un despliegue: **apaga
  # también los INFO de arranque de Spring**, incluido el «Started UkunApiApplication in N seconds».
  # Un servicio recién desplegado dejará de anunciarse, y eso parece un arranque fallido cuando no lo
  # es — quien responde por él es /actuator/health, que es lo que sondea el contenedor.
  level:
    root: WARN
    ukun.business: INFO
