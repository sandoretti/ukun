spring:
  application:
    name: ukun-auth

  # Credentials come from the environment (compose.yaml injects SPRING_DATASOURCE_*); there is no
  # default here on purpose, so a misconfigured deployment fails at startup instead of silently
  # pointing somewhere else. This is a different database from ukun-api's: ukun_auth, created empty
  # by scripts/postgres-init-databases.sh (ADR-0004).
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  # Liquibase owns the schema of ukun_auth, and owns it alone: each service with a database of its
  # own keeps its own master changelog (skill `liquibase`, rule 6). There is nothing shared with
  # ukun_app — different databases, different change histories.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Never leave this unset. With no contexts configured Liquibase runs *every* changeset, and the
    # demo changesets seed accounts whose password is written down in docs/06-entorno-local-tilt.md:
    # the failure mode of forgetting this line is not "the demo data is missing", it is "production
    # seeded itself with public credentials". Schema changesets carry no context and therefore always
    # apply, whichever value is active here.
    contexts: prod

  # El texto de la página de login (messages.properties, en español, y messages_en.properties).
  #
  # `fallback-to-system-locale: false` no es afinado: con el valor por defecto (`true`), un idioma
  # sin bundle exacto —`es`, que se sirve desde el fichero base— cae al locale del SISTEMA antes que
  # al fichero base. La imagen trae `LANG=en_US.UTF-8`, así que la página salía en inglés para todo
  # el mundo, con cualquier `Accept-Language` y hasta con `?lang=es`. Y no lo veía ningún test,
  # porque en una máquina con el locale en español el mismo código responde en español: el idioma
  # de quien construye decidía el de quien lee.
  messages:
    fallback-to-system-locale: false

  jpa:
    hibernate:
      # `validate`, never `create`/`update`: Hibernate checks the schema Liquibase created and never
      # authors it. That includes the Authorization Server's own tables, which are transcribed into
      # the baseline rather than left to any auto-initialiser.
      ddl-auto: validate
    open-in-view: false

  security:
    oauth2:
      authorizationserver:
        # The `iss` claim, and the base of every URL in /.well-known/openid-configuration.
        #
        # It has to be configurable because two parties resolve this service by different names and
        # both have to agree with what the token says: the browser reaches the Authorization Server
        # through the gateway on localhost, while ukun-api validates `iss` from inside the container
        # network. Get these out of step and issue #24 rejects every token with an error that points
        # at the resource server rather than here.
        #
        # The default is the single-checkout value of docs/06-entorno-local-tilt.md; compose sets
        # UKUN_AUTH_ISSUER wherever that is not the truth.
        issuer: ${UKUN_AUTH_ISSUER:http://localhost:9000}

# The two OAuth2 clients. Only their secrets come from the environment — a client id is not a
# secret, and pretending it is only makes the configuration harder to read (docs/11 §4).
#
# There is no default for either secret on purpose: a service that starts with a well-known client
# secret is worse than one that refuses to start.
ukun:
  # A dónde vuelve el enlace «Volver a la tienda» de la página de login. Es la dirección del gateway
  # y no la de este servicio: aquí solo se teclea la contraseña, la tienda está al otro lado. Misma
  # variable de entorno que las redirect URIs de abajo, porque es literalmente el mismo sitio.
  store:
    url: ${UKUN_GATEWAY_BASE_URL:http://localhost:8080}

  oauth2:
    gateway:
      client-id: ukun-gateway
      secret: ${UKUN_OAUTH2_GATEWAY_SECRET}
      # Where ukun-gateway's oauth2Login receives the authorization code (v0.5). Registered now so
      # that slice does not have to come back and change this service.
      redirect-uris:
        - ${UKUN_GATEWAY_BASE_URL:http://localhost:8080}/login/oauth2/code/ukun
      post-logout-redirect-uris:
        - ${UKUN_GATEWAY_BASE_URL:http://localhost:8080}/
    api:
      client-id: ukun-api
      secret: ${UKUN_OAUTH2_API_SECRET}

  # The breach-corpus half of the password policy (docs/08 §8), on by default. It is a real HTTPS call
  # to api.pwnedpasswords.com per signup, k-anonymised: only the first five characters of the SHA-1
  # leave the process. Spring's checker fails open — if that host is unreachable the signup proceeds
  # and a WARN is logged — because a third party's availability does not get to decide whether people
  # can register. The integration suite sets this to false: an *IT does not reach the internet.
  password:
    compromised-check:
      enabled: true

  # Reconciliation of abandoned reservations (skill `spring-auth`, rule 7). This, and not the
  # best-effort :release, is what guarantees no orphan accounts — see AccountReconciliationJob.
  reconciliation:
    retention: PT24H
    cron: "0 30 3 * * *"

server:
  port: 9000

management:
  endpoints:
    web:
      exposure:
        # Only health for now. Anything else is opt-in per release, never by default.
        include: health
  endpoint:
    health:
      probes:
        enabled: true

  # Correlation across the three processes (docs/11-observabilidad-y-logging.md §5), with the same
  # two settings and the same reasoning as ukun-api. What it buys *here* is the signup saga: this
  # service reserves the account and ukun-api completes it, and until now a `signup.compensation`
  # logged here and the `signup.started` logged there were two lines nobody could join.
  tracing:
    sampling:
      # Boot's default is 0.1. Nine out of ten sagas unfollowable is not a sampling policy.
      probability: 1.0
    propagation:
      # Produced *and* consumed as W3C only; Boot would otherwise also accept B3 and B3_MULTI.
      type: w3c

  # Y la exportación en sí, que es lo que v1.0 añade sobre lo anterior (docs/11 §5, fila de v1.0).
  #
  # Las dos propiedades que la encienden NO se declaran aquí, y la omisión es la configuración:
  #   management.opentelemetry.tracing.export.otlp.endpoint  -> MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
  #   management.otlp.metrics.export.url                     -> MANAGEMENT_OTLP_METRICS_EXPORT_URL
  # Sin la variable la propiedad no existe, no se instala exportador y el servicio arranca igual, que
  # es lo que tiene que pasar donde no hay colector. compose.dev.yaml las pone apuntando al de Tilt;
  # en producción salen del despliegue (ADR-0023, issue #55). Declararlas aquí con un default vacío
  # sería peor: la propiedad presente y sin URL es un exportador configurado contra ninguna parte.
  #
  # Los dos nombres se leen dos veces antes de escribirlos. Boot 4 movió el de trazas a
  # `management.opentelemetry.*` y dejó el de métricas en `management.otlp.*`, y escribir el nombre de
  # Boot 3.x no da error: la propiedad desconocida se ignora y no se exporta nada.
  #
  # Y dos interruptores que NO son afinado: son los dos defaults de Boot que exportarían solos.
  #
  # `management.otlp.metrics.export.enabled` viene a `true`, y cuando no hay URL Micrometer cae a la
  # suya, `http://localhost:4318/v1/metrics`. O sea: en cuanto micrometer-registry-otlp entró en el
  # classpath con el starter, este servicio empezaría a hacer POST a un puerto cerrado cada minuto —
  # en cada test, en cada `java -jar` y en cada PR de CI—, avisando de una conexión rechazada que
  # nadie relacionaría con este cambio. Se enciende donde hay colector (compose.dev.yaml) y en ningún
  # otro sitio. Las trazas no necesitan gemelo de esta línea: su exportador lleva
  # @ConditionalOnProperty sobre el endpoint, así que sin endpoint no se instala.
  #
  # Y los logs no salen por OTLP, que es una decisión y no un olvido: docs/11 §7 los deja en stdout y
  # el agregador es de ADR-0023. Boot los exportaría en cuanto alguien pusiera un endpoint —incluida
  # una variable OTEL_* del entorno, que gana a este fichero—, así que la decisión se escribe aquí en
  # vez de quedarse en el documento.
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

---
spring:
  config:
    activate:
      on-profile: dev

  # compose.dev.yaml sets SPRING_PROFILES_ACTIVE=dev, so `tilt up` gets the fourteen demo accounts
  # of db/changelog/demo/ with no extra wiring.
  liquibase:
    contexts: demo

# No /actuator/modulith here, unlike ukun-api: this service has no application modules to print
# (ADR-0022). Nothing else is dev-only in it yet — springdoc is not wired because the only contract
# it exposes, /internal/accounts, is service-to-service and lives in docs/api/openapi/ukun-auth.yaml.

# El otro lado de la tabla de docs/11 §7. En desarrollo interesa lo contrario que en producción: el
# arranque se lee, y el código propio habla más que nadie.
#
# `dev.sandoretti.ukun` es el paquete —las clases—, distinto de los loggers `ukun.business` y
# `ukun.access`, que llevan nombre propio y no cuelgan de él. Y nada de SQL: docs/11 §7 lo deja
# apagado siempre, y para depurar una consulta se sube `org.hibernate.SQL` a mano y a ratos.
logging:
  level:
    root: INFO
    dev.sandoretti.ukun: DEBUG

---
# El formato de producción, en un documento `!dev` y no en un perfil `prod`.
#
# Lo de `!dev` en vez de `prod` es lo que ya hace el resto del fichero: el documento por defecto ES el
# de producción y `dev` releva lo que en desarrollo se quiere distinto (springdoc, los contexts de
# Liquibase). Un perfil `prod` obligaría además a activarlo en el despliegue, y hoy nadie lo activa.
#
# Lo que sí es una elección es tenerlo en documento aparte en vez de arriba con un `console: ""` en el
# documento `dev` —que funcionaría: DefaultLogbackConfiguration elige entre PatternLayoutEncoder y
# StructuredLogEncoder con StringUtils.hasLength(formato), así que la cadena vacía es exactamente «no
# estructurado», y es el mecanismo que usa la tanda de tests en ukun-java-conventions.gradle.kts—. Se
# prefiere el documento porque las dos propiedades de abajo tienen que ir juntas: la máscara de
# secretos solo actúa sobre el JSON, así que un formato activo sin su customizer es logging de
# producción sin la capa 3 de docs/11 §4, y ese es el fallo que nadie nota. Aquí no se pueden
# desalinear.
spring:
  config:
    activate:
      on-profile: "!dev"

logging:
  structured:
    format:
      # ECS y no `logstash`: nombra los campos igual que cualquier stack Elastic/OpenSearch al que se
      # envíen algún día e incluye el MDC en el JSON sin configuración adicional (docs/11 §5). Eso
      # último es la mitad del valor del diseño: los campos que BusinessEvents estampa en el MDC pasan
      # a ser campos JSON indexables sin tocar una línea de BusinessEvents.
      console: ecs
    json:
      # La cuarta capa de docs/11 §4. Solo aquí: en local un secreto mal logueado tiene que verse para
      # que se corrija, y este documento no se activa bajo `dev`.
      customizer: dev.sandoretti.ukun.auth.security.SecretMaskingJsonCustomizer

  # Los niveles que docs/11 §7 promete para producción, que hasta ahora el documento afirmaba y el
  # código no cumplía. Lo que hacen juntos: apagar el ruido y dejar encendido exactamente lo que la
  # tabla de eventos de §3 emite, para que «solo lo que afecta al usuario» sea una configuración y no
  # una promesa. Por eso BusinessEvents tiene logger propio.
  #
  # `root: WARN` tiene una consecuencia que conviene saber antes de verla en un despliegue: **apaga
  # también los INFO de arranque de Spring**, incluido el «Started UkunApiApplication in N seconds».
  # Un servicio recién desplegado dejará de anunciarse, y eso parece un arranque fallido cuando no lo
  # es — quien responde por él es /actuator/health, que es lo que sondea el contenedor.
  level:
    root: WARN
    ukun.business: INFO
