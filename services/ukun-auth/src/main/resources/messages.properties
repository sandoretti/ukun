# Texto de la página de login, en español — el idioma de reserva de este servicio.
#
# Las claves van en inglés (ADR-0018) y el texto es lo único bilingüe, igual que en el SPA. Lo que
# NO es igual: esto es un MessageSource de Spring y no los JSON de react-i18next, porque esta
# página se renderiza aquí y no en React (ADR-0003). Son dos islas de texto y no hay forma de que
# sean una sola mientras la contraseña se teclee en este origen; el test de paridad de traducciones
# del front no llega hasta aquí, así que las dos variantes se revisan a ojo al tocarlas.

