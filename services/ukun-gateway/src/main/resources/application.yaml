spring:
  application:
    name: ukun-gateway

  # La línea sin la cual el tracing de este servicio no se ve en ningún log, y la única propiedad de
  # esta slice que es exclusiva del gateway. En un servicio reactivo el MDC no acompaña a la petición:
  # cada señal puede cambiar de hilo, y el patrón de log lee `%mdc{traceId}` en el hilo donde acaba
  # escribiendo. Reactor sabe restaurarlo, pero hay que pedírselo.
  #
  # Comprobado en el bytecode de ReactorAutoConfiguration (Boot 4.1), no supuesto: llama a
  # Hooks.enableAutomaticContextPropagation() SOLO si este valor es `auto`. El defecto es `limited`, y
  # con él error/TraceIds seguiría inventando un UUID por respuesta de error mientras el trace real
  # existe y viaja hacia ukun-api.
  reactor:
    context-propagation: auto

  cloud:
    gateway:
      # El prefijo lleva `server.webflux` desde el tren 2025.x, igual que el artefacto: el
      # `spring.cloud.gateway.routes` de cualquier ejemplo anterior ya no lo lee nadie, y una ruta
      # bajo el prefijo viejo no falla — simplemente no existe.
      server:
        webflux:
          # Estas cinco rutas son el sustituto del nginx/nginx.conf legacy (skill `spring-gateway`
          # §4). No se portan sus dos `location` hacia los monolitos, que no están en servicio
          # (ADR-0007): lo que se porta es el papel de único punto de entrada.
          #
          # No hay ruta para /internal/** y eso es el mecanismo, no un olvido: sin ruta, sin recurso
          # estático y excluida del fallback del SPA (ReservedPaths), ningún HandlerMapping devuelve
          # handler y el DispatcherHandler responde 404. Ver docs/08 §3 y GatewayRoutingIT.
          routes:
            - id: api
              uri: ${ukun.gateway.api-uri}
              predicates:
                - Path=/api/**
              # El relevo del token de ADR-0003: la sesión del navegador entra por aquí y sale como
              # `Authorization: Bearer <JWT>` hacia ukun-api. Va SOLO en esta ruta, y las otras cuatro
              # no lo llevan por razones distintas: /media/** es pública y no lo necesita, y mandarle
              # un Bearer al Authorization Server (/oauth2/**, /login/oauth2/**, /.well-known/**)
              # sería un error de diseño, no una redundancia.
              #
              # Sin sesión no falla: el filtro solo añade la cabecera si hay principal, que es lo que
              # deja pasar a GET /api/products anónimo (docs/08 §4).
              filters:
                - TokenRelay=

            # Las fotos de producto. El gateway es dueño de la RUTA; el adaptador que las sirve vive
            # en el módulo `storage` de ukun-api, porque es lo que pasa a ser un cliente de S3 en
            # v1.1 (ADR-0017 §1, docs/08 §9). Aquí no se configura ningún directorio de ficheros.
            - id: media
              uri: ${ukun.gateway.api-uri}
              predicates:
                - Path=/media/**

            # OJO al montar el BFF (issue #28): /oauth2/authorization/{id} y /login/oauth2/code/{id}
            # son endpoints LOCALES de la cadena de seguridad de este servicio y ganan a estas dos
            # rutas por construcción, no por configuración. Explicado en GatewaySecurityConfig.
            - id: auth-oauth2
              uri: ${ukun.gateway.auth-uri}
              predicates:
                - Path=/oauth2/**

            - id: auth-login
              uri: ${ukun.gateway.auth-uri}
              predicates:
                - Path=/login/oauth2/**

            # El documento de descubrimiento del Authorization Server, que es lo que el navegador
            # necesita alcanzar además de /oauth2/**. No está en ukun-auth.yaml a propósito: es
            # estándar y lo publica Spring Authorization Server (ver la introducción de ese contrato).
            - id: auth-well-known
              uri: ${ukun.gateway.auth-uri}
              predicates:
                - Path=/.well-known/**

server:
  port: 8080

  reactive:
    session:
      cookie:
        # El único credencial que el navegador maneja (ADR-0003). HttpOnly es lo que lo deja fuera
        # del alcance de cualquier XSS; SameSite=Lax permite la vuelta del callback de OAuth2, que
        # es una navegación GET de otro origen, y corta el envío en peticiones de terceros.
        http-only: true
        same-site: Lax
        # Secure NO se fija aquí a propósito: `tilt up` sirve el stack por HTTP y un `Secure`
        # incondicional dejaría la sesión sin funcionar en el único entorno que se puede probar.
        # El despliegue con TLS lo activa por entorno (SERVER_REACTIVE_SESSION_COOKIE_SECURE=true).

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

  # La correlación de los tres procesos (docs/11-observabilidad-y-logging.md §5). Este servicio es el
  # extremo que importa: es el único que habla con el navegador, así que es quien ACUÑA el traceId
  # cuando la petición no trae `traceparent` — y ninguna del navegador lo trae. Auth y api lo heredan.
  #
  # Nada de esto exporta un trace a ningún sitio. Lo que compra es el traceId en el MDC; el exportador
  # OTLP es de v1.0.
  tracing:
    sampling:
      # El defecto de Boot es 0.1, y con él nueve de cada diez peticiones serían imposibles de seguir
      # entre servicios, que es justo el problema que este release resuelve. docs/11 §5 fija 1.0.
      probability: 1.0
    propagation:
      # Boot ya PRODUCE W3C, pero por defecto CONSUME también B3 y B3_MULTI. Se estrecha a uno a
      # propósito: quien entra por aquí es un navegador, no otro sistema de tracing.
      type: w3c

  # Y la exportación en sí, que es lo que v1.0 añade sobre lo anterior (docs/11 §5, fila de v1.0).
  #
  # Las dos propiedades que la encienden NO se declaran aquí, y la omisión es la configuración:
  #   management.opentelemetry.tracing.export.otlp.endpoint  -> MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
  #   management.otlp.metrics.export.url                     -> MANAGEMENT_OTLP_METRICS_EXPORT_URL
  # Sin la variable la propiedad no existe, no se instala exportador y el servicio arranca igual, que
  # es lo que tiene que pasar donde no hay colector. compose.dev.yaml las pone apuntando al de Tilt;
  # en producción salen del despliegue (ADR-0023, issue #55). Declararlas aquí con un default vacío
  # sería peor: la propiedad presente y sin URL es un exportador configurado contra ninguna parte.
  #
  # Los dos nombres se leen dos veces antes de escribirlos. Boot 4 movió el de trazas a
  # `management.opentelemetry.*` y dejó el de métricas en `management.otlp.*`, y escribir el nombre de
  # Boot 3.x no da error: la propiedad desconocida se ignora y no se exporta nada.
  #
  # Y dos interruptores que NO son afinado: son los dos defaults de Boot que exportarían solos.
  #
  # `management.otlp.metrics.export.enabled` viene a `true`, y sin URL Micrometer cae a la suya,
  # `http://localhost:4318/v1/metrics`. O sea: en cuanto micrometer-registry-otlp entró en el
  # classpath con el starter, este servicio se pondría a hacer POST a un puerto cerrado cada minuto
  # —en cada test, en cada `java -jar` y en cada PR de CI—, avisando de una conexión rechazada que
  # nadie relacionaría con este cambio. Se enciende donde hay colector (compose.dev.yaml) y en ningún
  # otro sitio. Las trazas no necesitan gemelo de esta línea: su exportador lleva
  # @ConditionalOnProperty sobre el endpoint, así que sin endpoint no se instala.
  #
  # Y los logs no salen por OTLP, que es una decisión y no un olvido: docs/11 §7 los deja en stdout y
  # el agregador es de ADR-0023. Boot los exportaría en cuanto alguien pusiera un endpoint —incluida
  # una variable OTEL_* del entorno, que gana a este fichero—, así que la decisión se escribe aquí en
  # vez de quedarse en el documento.
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

ukun:
  # El cliente OAuth2 que es este servicio (ADR-0003). Prefijo propio y no
  # spring.security.oauth2.client.*: esas propiedades no pueden expresar este despliegue, y el porqué
  # está en ClientRegistrationConfig — `issuer-uri` dispara un discovery en el arranque contra una URL
  # que solo el navegador resuelve.
  #
  # La partición importante de este bloque es quién sigue cada URL. Las dos primeras las sigue el
  # NAVEGADOR y tienen que resolverse desde el host; las dos siguientes las pide ESTE PROCESO desde
  # dentro de la red de Docker. Son los mismos nombres de variable que ya usa ukun-api, para que un
  # checkout desplazado se configure una sola vez y los dos servicios coincidan.
  oauth2:
    client-id: ukun-gateway
    # Sin default, igual que en ukun-auth: un servicio que arranca con un secreto conocido es peor
    # que uno que se niega a arrancar. Los dos lectores tienen que coincidir (.env.example).
    secret: ${UKUN_OAUTH2_GATEWAY_SECRET}

    issuer: ${UKUN_AUTH_ISSUER:http://localhost:9000}
    authorization-uri: ${UKUN_AUTH_ISSUER:http://localhost:9000}/oauth2/authorize
    end-session-uri: ${UKUN_AUTH_ISSUER:http://localhost:9000}/connect/logout

    token-uri: ${UKUN_AUTH_TOKEN_URI:http://ukun-auth:9000/oauth2/token}
    jwk-set-uri: ${UKUN_AUTH_JWK_SET_URI:http://ukun-auth:9000/oauth2/jwks}

    # Con la barra final, que no sobra: ukun-auth registró esta URI en el issue #22 y compara
    # post_logout_redirect_uri como una cadena literal.
    post-logout-redirect-uri: ${UKUN_GATEWAY_BASE_URL:http://localhost:8080}/

  gateway:
    # Nombre interno del contenedor por defecto, sobreescribible por entorno: es el patrón que ya
    # usa ukun-api con UKUN_AUTH_JWK_SET_URI, y lo que permite que cada worktree desplace los
    # puertos sin tocar este fichero. Los tests de integración apuntan estos dos a un stub.
    api-uri: ${UKUN_API_URI:http://ukun-api:8081}
    auth-uri: ${UKUN_AUTH_URI:http://ukun-auth:9000}
    web-uri: ${UKUN_WEB_URI:http://ukun-web:5173}

    # Todavía no hay nada que deje aquí el build de apps/ukun-web (haría falta una etapa de build del
    # frontend en el Dockerfile, que es de otra pista). Hasta entonces el fallback responde 404, que
    # es exactamente lo que hace un directorio vacío.
    web-root: ${UKUN_WEB_ROOT:file:/opt/app/web/}

    # El mismo valor que spring.servlet.multipart.max-file-size de ukun-api. Que los dos coincidan es
    # lo que evita repetir el defecto #17 (docs/08 §9).
    max-body-size: 5MB

    # 'unsafe-inline' aparece en style-src y SOLO ahí: react-bootstrap posiciona dropdowns, tooltips
    # y modales escribiendo el atributo `style` desde Popper, que la directiva cubre. script-src se
    # queda sin él a propósito — es la mitad que de verdad importa (docs/08 §8).
    #
    # `form-action` incluye el origen de ukun-auth, y no por gusto: el logout sale de un <form> que
    # apunta a 'self' (`POST /logout`), pero el gateway responde 302 hacia el end session endpoint
    # del servidor de autorización, y Chrome aplica la directiva **también a los redirects** que
    # sigue el envío de un formulario. Con solo 'self' el navegador bloquea ese salto sin decírselo
    # a nadie: el gateway registra su `auth.logout`, la sesión de ukun-auth nunca termina y volver a
    # «entrar» devuelve al mismo usuario sin pedir contraseña — que es justo lo que el RP-initiated
    # logout de `GatewaySecurityConfig` existe para impedir.
    content-security-policy: >-
      default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
      img-src 'self' data:; font-src 'self'; connect-src 'self';
      frame-ancestors 'none'; base-uri 'self';
      form-action 'self' ${UKUN_AUTH_ISSUER:http://localhost:9000}; object-src 'none'

---
spring:
  config:
    activate:
      on-profile: dev

  # `tilt up` sirve la aplicación entera por el gateway (docs/06-entorno-local-tilt.md), así que el
  # dev server de Vite queda detrás de él y su HMR también. La ruta que lo enruta vive en Java
  # (DevSpaRouteConfig) y no aquí: una lista bajo `on-profile` REEMPLAZA a la del documento por
  # defecto en vez de sumarse, así que declararla aquí borraría las cinco rutas de arriba. Los
  # RouteLocator, en cambio, se componen.

# A través del gateway, el dev server inyecta el preámbulo de React Refresh y el polyfill de
# modulepreload como <script> inline, mete el CSS de cada módulo como <style> en caliente, y abre el
# websocket de HMR contra el propio origen. Sin estas tres relajaciones la aplicación no arranca en
# el puerto del gateway. Es una propiedad escalar, así que aquí sí se puede sobreescribir.
ukun:
  gateway:
    content-security-policy: >-
      default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws:;
      frame-ancestors 'none'; base-uri 'self';
      form-action 'self' ${UKUN_AUTH_ISSUER:http://localhost:9000}; object-src 'none'

# El otro lado de la tabla de docs/11 §7. En desarrollo interesa lo contrario que en producción: el
# arranque se lee, y el código propio habla más que nadie.
#
# `dev.sandoretti.ukun` es el paquete —las clases—, distinto de los loggers `ukun.business` y
# `ukun.access`, que llevan nombre propio y no cuelgan de él. Y nada de SQL: docs/11 §7 lo deja
# apagado siempre, y para depurar una consulta se sube `org.hibernate.SQL` a mano y a ratos.
logging:
  level:
    root: INFO
    dev.sandoretti.ukun: DEBUG

---
# El formato de producción, en un documento `!dev` y no en un perfil `prod`.
#
# Lo de `!dev` en vez de `prod` es lo que ya hace el resto del fichero: el documento por defecto ES el
# de producción y `dev` releva lo que en desarrollo se quiere distinto (springdoc, los contexts de
# Liquibase). Un perfil `prod` obligaría además a activarlo en el despliegue, y hoy nadie lo activa.
#
# Lo que sí es una elección es tenerlo en documento aparte en vez de arriba con un `console: ""` en el
# documento `dev` —que funcionaría: DefaultLogbackConfiguration elige entre PatternLayoutEncoder y
# StructuredLogEncoder con StringUtils.hasLength(formato), así que la cadena vacía es exactamente «no
# estructurado», y es el mecanismo que usa la tanda de tests en ukun-java-conventions.gradle.kts—. Se
# prefiere el documento porque las dos propiedades de abajo tienen que ir juntas: la máscara de
# secretos solo actúa sobre el JSON, así que un formato activo sin su customizer es logging de
# producción sin la capa 3 de docs/11 §4, y ese es el fallo que nadie nota. Aquí no se pueden
# desalinear.
spring:
  config:
    activate:
      on-profile: "!dev"

logging:
  structured:
    format:
      # ECS y no `logstash`: nombra los campos igual que cualquier stack Elastic/OpenSearch al que se
      # envíen algún día e incluye el MDC en el JSON sin configuración adicional (docs/11 §5). Eso
      # último es la mitad del valor del diseño: los campos que BusinessEvents estampa en el MDC pasan
      # a ser campos JSON indexables sin tocar una línea de BusinessEvents.
      console: ecs
    json:
      # La cuarta capa de docs/11 §4. Solo aquí: en local un secreto mal logueado tiene que verse para
      # que se corrija, y este documento no se activa bajo `dev`.
      customizer: dev.sandoretti.ukun.gateway.security.SecretMaskingJsonCustomizer

  # Los niveles que docs/11 §7 promete para producción, que hasta ahora el documento afirmaba y el
  # código no cumplía. Lo que hacen juntos: apagar el ruido y dejar encendido exactamente lo que la
  # tabla de eventos de §3 emite, para que «solo lo que afecta al usuario» sea una configuración y no
  # una promesa. Por eso BusinessEvents tiene logger propio.
  #
  # `root: WARN` tiene una consecuencia que conviene saber antes de verla en un despliegue: **apaga
  # también los INFO de arranque de Spring**, incluido el «Started UkunApiApplication in N seconds».
  # Un servicio recién desplegado dejará de anunciarse, y eso parece un arranque fallido cuando no lo
  # es — quien responde por él es /actuator/health, que es lo que sondea el contenedor.
  level:
    root: WARN
    ukun.business: INFO
    # docs/11 §7 solo nombraba `ukun.business`, porque la tabla se escribió antes de que existiera
    # este logger: el access log llegó con el gateway en v0.5 (§6). Sin esta línea, `root: WARN` lo
    # apagaría en producción y se perdería el único punto de verdad del tráfico HTTP.
    ukun.access: INFO
