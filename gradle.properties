# Ajustes del build de Gradle (ADR-0021).

# Caché de tareas entre builds: es la mitad de la agilidad que motivó dejar Maven. La otra mitad es
# el daemon, que en este repo vive en el host y no en un contenedor efímero (docs/06, ADR-0021).
org.gradle.caching=true

# Los tres servicios son independientes entre sí — no hay ni una dependencia de proyecto a proyecto
# (ADR-0001, "sin módulo de código compartido") — así que se compilan en paralelo sin coordinación.
org.gradle.parallel=true

# El daemon es el que mantiene caliente la JVM y el análisis incremental entre ciclos de Tilt.
org.gradle.daemon=true

# Cachea el grafo de tareas además de sus salidas: se salta la fase de configuración cuando nada que
# la afecte ha cambiado. Verificada con un `clean build --no-build-cache` completo (las dos tandas de
# test en verde, cero problemas reportados) antes de activarla — el plugin de Boot y `test-logger` la
# soportan en las versiones fijadas en el catálogo. Si una subida de cualquiera de los dos empieza a
# reportar problemas, se desactiva aquí y se anota el motivo; no es un requisito del build.
org.gradle.configuration-cache=true
