# Override de compose.yaml para uso con Tilt (docs/06-entorno-local-tilt.md).
services:
  db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./scripts/postgres-init-databases.sh:/docker-entrypoint-initdb.d/00-databases.sh:ro

  ukun-api:
    build:
      context: ./services/ukun-api
      dockerfile: Dockerfile.dev
    # Without this, the dev-only tooling declared in application.yaml (Swagger UI,
    # /actuator/modulith) stays off under `tilt up`, which is the one environment it exists for.
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "5005:5005"
    depends_on:
      db:
        condition: service_healthy

  ukun-auth:
    build:
      context: ./services/ukun-auth
      dockerfile: Dockerfile.dev
    ports:
      - "5006:5005"
    depends_on:
      db:
        condition: service_healthy

  ukun-gateway:
    build:
      context: ./services/ukun-gateway
      dockerfile: Dockerfile.dev
    ports:
      - "5007:5005"
    depends_on:
      ukun-api:
        condition: service_started
      ukun-auth:
        condition: service_started

  ukun-web:
    build:
      context: ./apps/ukun-web
      dockerfile: Dockerfile.dev
