# Override de compose.yaml para uso con Tilt (docs/06-entorno-local-tilt.md).
services:
  db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./scripts/postgres-init-databases.sh:/docker-entrypoint-initdb.d/00-databases.sh:ro

  ukun-api:
    build:
      # La raíz del repo, igual que en compose.yaml: el Dockerfile.dev copia de services/<x>/build/,
      # y Tilt necesita ese contexto para poder vigilar los ficheros de build compartidos.
      context: .
      dockerfile: services/ukun-api/Dockerfile.dev
    # Without this, the dev-only tooling declared in application.yaml (Swagger UI,
    # /actuator/modulith) stays off under `tilt up`, which is the one environment it exists for.
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "${JDWP_API_PORT:-5005}:5005"
    depends_on:
      db:
        condition: service_healthy

  ukun-auth:
    build:
      # La raíz del repo, igual que en compose.yaml: el Dockerfile.dev copia de services/<x>/build/,
      # y Tilt necesita ese contexto para poder vigilar los ficheros de build compartidos.
      context: .
      dockerfile: services/ukun-auth/Dockerfile.dev
    # Sin esto el perfil dev de application.yaml no se activa nunca, y con él el `contexts: demo` de
    # Liquibase que siembra las catorce cuentas de demostración (contraseña en
    # `docs/06-entorno-local-tilt.md`). ukun-api ya lo tenía; ukun-auth no, y no se notaría hasta que
    # alguien se preguntase por qué no puede iniciar sesión con ninguna cuenta.
    # (Aquí no hay /actuator/modulith que activar, a diferencia de ukun-api: ADR-0022.)
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "${JDWP_AUTH_PORT:-5006}:5005"
    depends_on:
      db:
        condition: service_healthy

  ukun-gateway:
    build:
      # La raíz del repo, igual que en compose.yaml: el Dockerfile.dev copia de services/<x>/build/,
      # y Tilt necesita ese contexto para poder vigilar los ficheros de build compartidos.
      context: .
      dockerfile: services/ukun-gateway/Dockerfile.dev
    # Sin esto el gateway serviría el SPA como build estático, y en desarrollo ese build no existe:
    # el perfil dev es el que enruta hacia el dev server de Vite con HMR y el que relaja la CSP para
    # que arranque (docs/06-entorno-local-tilt.md, DevSpaRouteConfig).
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "${JDWP_GATEWAY_PORT:-5007}:5005"
    depends_on:
      ukun-api:
        condition: service_started
      ukun-auth:
        condition: service_started
      ukun-web:
        condition: service_started

  ukun-web:
    build:
      context: ./apps/ukun-web
      dockerfile: Dockerfile.dev
