# CI de ukun. Cuatro trabajos de comprobación que corren a la vez —el frontend (segundos), el
# backend (la tanda larga con Testcontainers), los recorridos de Playwright contra el stack de
# verdad, y `infra`, que solo comprueba que la plantilla de despliegue compila—, y un quinto que no
# comprueba nada: `images` publica las imágenes de producción en GHCR y cuelga de los tres primeros.
#
# El reparto de los tres primeros no se decide aquí: lo fija `docs/13-testing.md` §3 «Reparto por
# fase de CI», y este fichero lo implementa. Si los dos discrepan, manda el documento. `images` e
# `infra` no salen de ese documento sino de ADR-0023 (issue #55), que es quien elige GHCR, el
# etiquetado por SHA y Bicep.
#
# LO QUE ESTE PIPELINE NO PUEDE HACER: impedir un merge. Las reglas de protección de rama no están
# disponibles en un repositorio privado del plan gratuito, así que el resultado es informativo. El
# día que el repo sea público o de pago, los checks a marcar como obligatorios son los cuatro
# trabajos de comprobación — `images` no, que no juzga nada y solo corre después de ellos. Está
# anotado también en `docs/13-testing.md` §3.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Un push nuevo sobre la misma rama cancela la ejecución anterior. En un repositorio privado los
# minutos son finitos y la única ejecución que interesa de una rama es la última.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ukun-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/ukun-web/.node-version
          cache: npm
          cache-dependency-path: apps/ukun-web/package-lock.json

      # `ci` y no `install`: respeta el lock exacto, incluido el `override` de js-yaml que
      # `docs/05-stack-y-versiones.md` justifica.
      - run: npm ci

      - run: npm run lint

      - run: npx tsc -b

      - run: npm run test

      # Redundante con `test` salvo que alguien acote el `include` de Vitest, y esa es justo la
      # razón de nombrarla: la paridad de traducciones es lo que sostiene ADR-0019.
      - run: npm run test:i18n

      # Y por lo mismo, la auditoría de accesibilidad: axe sobre las pantallas de los tres recorridos
      # es lo que sostiene §Accesibilidad de `docs/07-frontend-ux-ui.md`, y nombrarla aquí la hace
      # sobrevivir a que alguien acote el `include`. Es la mitad que corre sin stack; la otra —el
      # contraste, el anillo de foco y el orden de tabulación, que jsdom no puede juzgar porque no
      # maqueta— va con `@axe-core/playwright` dentro del trabajo `e2e`.
      - run: npm run test:a11y

      # La tercera dirección de la deriva del contrato, y la única que nadie más cubre:
      # `OpenApiDriftIT` compara el YAML con el código Java, y esto compara el YAML con los tipos
      # que consume el SPA. `src/types/api.d.ts` está versionado y se genera de ese mismo YAML, así
      # que regenerarlo no debe producir ningún cambio.
      - name: El contrato y los tipos del SPA no han derivado
        run: |
          npm run generate:api
          git diff --exit-code -- src/types/api.d.ts

  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Temurin 25 explícito y no negociable: `settings.gradle.kts` no aplica el plugin
      # `foojay-resolver`, así que Gradle no sabe auto-descargarse el toolchain que pide
      # `ukun-java-conventions.gradle.kts`. Sin este paso el build muere con «No matching toolchains».
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # Una sola invocación de `build`, y a propósito. `jacocoTestCoverageVerification` lee los
      # ficheros `.exec` del disco en vez de depender de la tarea que los produce, de modo que
      # repartir las tandas en pasos o trabajos distintos lo dejaría pasando en verde sin medir nada.
      #
      # `--max-workers=1` porque `gradle.properties` trae `org.gradle.parallel=true`: en el host es
      # lo que se quiere, pero en un runner de dos núcleos pondría a la vez dos JVM de Spring, dos
      # Postgres y dos Ryuk. Esta suite ya se topó una vez con «too many clients already».
      - name: build (unitarios + integración + Jacoco + deriva de OpenAPI)
        run: ./gradlew build --max-workers=1 --no-daemon

      - name: Informes de test
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informes-backend
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/ukun-web/.node-version
          cache: npm
          cache-dependency-path: apps/ukun-web/package-lock.json

      # Los `Dockerfile.dev` no compilan nada: hacen `COPY services/<x>/build/{classes,resources,
      # dependency}`. Sin este paso, `docker compose --build` falla en el COPY, no en runtime.
      #
      # `classes` y `copyDeps`, no `build`: son las dos tareas que el `local_resource` del Tiltfile
      # ejecuta, y `copyDeps` no cuelga de `build` — hay que pedirla por su nombre.
      - name: Compilar lo que las imágenes de desarrollo esperan del host
        run: |
          ./gradlew --no-daemon -q \
            :ukun-api:classes     :ukun-api:copyDeps \
            :ukun-auth:classes    :ukun-auth:copyDeps \
            :ukun-gateway:classes :ukun-gateway:copyDeps

      # Los dos ficheros y en este orden. Sin el override no hay base `ukun_auth` (nadie monta
      # `scripts/postgres-init-databases.sh`), no hay perfil `dev` —y por tanto ni datos demo de
      # Liquibase ni ruta hacia Vite, con lo que el gateway serviría un SPA vacío—, y el build de
      # `ukun-web` ni siquiera arranca: `compose.yaml` nombra un `Dockerfile` que no existe.
      #
      # Los secretos se interpolan del entorno; Compose no necesita un `.env`. Cualquier valor sirve
      # mientras coincida entre los dos lectores de cada par (`.env.example` lo explica).
      - name: Levantar el stack
        env:
          POSTGRES_USER: ukun
          POSTGRES_PASSWORD: ukun-ci
          POSTGRES_DB: ukun_app
          UKUN_OAUTH2_GATEWAY_SECRET: ci-gateway-secret
          UKUN_OAUTH2_API_SECRET: ci-api-secret
        # La clave de firma se genera aquí en vez de escribirse arriba, y por dos motivos. Uno: no
        # tiene valor por defecto a propósito (ADR-0024), así que sin ella `ukun-auth` se niega a
        # arrancar — y como compose interpola una variable ausente a cadena vacía, el stack sube
        # igual y solo se cae el login, que es como se descubrió. Dos: una clave privada, aunque sea
        # de usar y tirar, no se escribe en un fichero versionado. Es el mismo comando que
        # `.env.example` le da a quien monta el entorno en su máquina.
        run: |
          UKUN_SIGNING_KEY=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null \
            | openssl pkcs8 -topk8 -nocrypt -outform DER | base64 -w0)
          export UKUN_SIGNING_KEY
          docker compose -f compose.yaml -f compose.dev.yaml up -d --build

      # Sondeo propio en vez de `up --wait`: las imágenes de desarrollo no declaran HEALTHCHECK, así
      # que compose daría por listo un contenedor que aún está migrando con Liquibase. Y hay que
      # esperar aquí y no dentro de Playwright: `globalSetup.ts` hace un único `fetch` con cinco
      # segundos de gracia y sin reintentos.
      - name: Esperar a que el gateway esté sano
        run: |
          timeout 300 bash -c \
            'until curl -sf http://localhost:8080/actuator/health | grep -q "\"status\":\"UP\""; do sleep 5; done'

      - name: Instalar Chromium
        working-directory: apps/ukun-web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Contra el gateway (8080), nunca contra el dev server de Vite: el 5173 proxya directo a
      # `ukun-api` y se salta la sesión y el CSRF, que es la mitad de lo que estos recorridos validan.
      - name: Los tres recorridos
        working-directory: apps/ukun-web
        run: npm run test:e2e

      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informe-playwright
          path: |
            apps/ukun-web/playwright-report/
            apps/ukun-web/test-results/
          retention-days: 7

      # Los logs del stack son la mitad de la explicación cuando un recorrido falla por algo que no
      # pasó en el navegador.
      - name: Logs del stack
        if: failure()
        run: docker compose -f compose.yaml -f compose.dev.yaml logs --no-color --tail=400

  # La plantilla de despliegue de ADR-0023 (issue #55) compila. Es el trabajo más barato de este
  # fichero y cubre el fallo más caro de los suyos: un Bicep que no compila no se descubre al
  # escribirlo —no hay `az` en la máquina de desarrollo, y el ADR ya lo anota como requisito de quien
  # despliega a mano— sino en mitad de un `workflow_dispatch`, con el grupo de recursos ya creado.
  #
  # `az bicep build` valida además las `apiVersion` y las propiedades de cada recurso contra los
  # tipos que trae el compilador, así que también caza una propiedad inventada, que es la clase de
  # error que en una plantilla no se ve leyéndola.
  #
  # No se autentica contra Azure ni lo necesita: compilar es una operación local.
  infra:
    name: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `az` viene preinstalado en el runner y se descarga el compilador de Bicep la primera vez.
      - name: La plantilla de Bicep compila
        run: az bicep build --file deploy/azure/main.bicep --outfile /dev/null

  # Las tres imágenes de producción, publicadas en GHCR y etiquetadas por SHA. Es el insumo del
  # despliegue de ADR-0023 (issue #55): `deploy.yml` recibe una etiqueta y Bicep la pasa a las tres
  # container apps. Aquí no se despliega nada — construir y desplegar son dos decisiones distintas y
  # el entorno de Azure es efímero a propósito.
  #
  # GHCR y no ACR (ADR-0023): Basic cuesta del orden de 5 USD/mes sobre un crédito anual de 100.
  # **Los tres paquetes son públicos**, así que Container Apps hace el pull sin credencial alguna —
  # es la misma línea que el OIDC federado del despliegue: el credencial que no existe no se filtra.
  # El primer push de cada paquete lo crea PRIVADO y hay que marcarlo público una vez a mano, en la
  # página del paquete; el síntoma de no haberlo hecho es un ImagePullBackOff en ACA, no un fallo
  # aquí.
  images:
    name: images
    runs-on: ubuntu-latest

    # Solo desde main. Un pull request no publica: la etiqueta que `deploy.yml` toma por defecto
    # tiene que corresponder a un commit que existe en la rama, no a una propuesta.
    if: github.event_name == 'push'

    # Y solo si las tres tandas han pasado. Alarga el camino hasta la imagen, y esa es la intención:
    # sin protección de rama disponible en este repositorio (ver la cabecera de este fichero), esta
    # dependencia es lo único que impide publicar una imagen que ningún test ha visto.
    needs: [frontend, backend, e2e]

    permissions:
      contents: read
      # Lo único que este trabajo necesita además de leer el código. El token de serie no lo trae.
      packages: write

    strategy:
      # Sin `fail-fast`: si una imagen falla, las otras dos terminan igual. Son tres builds
      # independientes y saber cuáles sobreviven es la mitad del diagnóstico.
      fail-fast: false
      matrix:
        service: [ukun-api, ukun-auth, ukun-gateway]

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # El token de serie del workflow. No hay ningún PAT en este repositorio.
          password: ${{ secrets.GITHUB_TOKEN }}

      # El contexto es la raíz del repositorio para las tres, no el directorio del servicio: los
      # Dockerfile copian gradlew, settings.gradle.kts y buildSrc/, y el de ukun-gateway además
      # construye apps/ukun-web en su etapa `web`. Cada uno trae su propio Dockerfile.dockerignore,
      # que BuildKit prefiere a cualquier .dockerignore de la raíz.
      #
      # LA CACHÉ NO ES AFINADO, es lo que hace este trabajo viable. Los Dockerfile compilan con
      # Gradle dentro de la imagen y se apoyan en un `--mount=type=cache` sobre ~/.gradle que en un
      # runner efímero no persiste entre ejecuciones: sin `type=gha` cada build vuelve a descargar la
      # distribución de Gradle y todas las dependencias. El `scope` por servicio es obligatorio —
      # con el ámbito por defecto los tres compartirían entrada y se desalojarían mutuamente.
      #
      # El aviso que va con ella: la caché de Actions tiene 10 GB por repositorio y desaloja por
      # LRU, así que `mode=max` sobre tres imágenes con capa de dependencias Java es justo la clase
      # de cosa que puede empezar a expulsar las cachés de Gradle del trabajo `backend`. Si eso pasa,
      # lo que se baja es este `mode=max` a `mode=min`, no la caché del build.
      #
      # `linux/amd64` implícito, que es lo que corre Container Apps y lo que es el propio runner: un
      # build multiplataforma aquí sería emulación QEMU sobre una compilación de Gradle, y no hay
      # ningún destino arm64 al que servirla.
      - name: Construir y publicar ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          # El SHA es la etiqueta que despliega, y `main` solo un alias móvil para mirar qué hay
          # publicado. `deploy.yml` recibe siempre un SHA: un despliegue tiene que poder repetirse
          # dando el mismo resultado, y `main` no lo garantiza.
          #
          # El nombre del propietario va en minúsculas por exigencia de GHCR. `sandoretti` ya lo
          # está; si algún día el repositorio cambia de dueño, esto es lo que hay que revisar.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:main
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
