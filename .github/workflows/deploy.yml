# Levanta o actualiza el entorno de Azure Container Apps de ADR-0023 (issue #55).
#
# Se dispara A MANO y nunca por push, y eso es la mitad del diseño: la suscripción es Azure for
# Students —100 USD para doce meses, con límite de gasto que SUSPENDE los recursos en vez de
# facturarlos—, así que el entorno existe mientras dura una demo y `teardown.yml` lo borra después.
# Un despliegue automático en cada merge convertiría ese crédito en un goteo que nadie mira.
#
# ACTUALIZAR ES DESPLEGAR OTRA VEZ. Este workflow ejecuta el Bicep completo, no un
# `az containerapp update --image`: lo segundo es más rápido y deja la plantilla desincronizada del
# entorno, que con infraestructura efímera es exactamente lo que hace que el siguiente despliegue
# desde cero se comporte distinto del que está corriendo. Bicep es idempotente y ACA crea una
# revisión nueva por cada cambio de imagen.
#
# NO HAY NINGUNA CREDENCIAL DE AZURE EN ESTE REPOSITORIO: la autenticación es OIDC federado sobre una
# managed identity de usuario (ADR-0023). El bootstrap que eso necesita —crear la identidad, la
# credencial federada y la asignación de rol— es manual y está en `docs/15-despliegue.md`.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'SHA del commit cuyas imágenes se despliegan (el que publicó el job `images` de CI). No uses `main`: un despliegue tiene que poder repetirse dando el mismo resultado.'
        required: true
        type: string

# Dos despliegues a la vez sobre el mismo grupo de recursos se pisan, y `cancel-in-progress` sería
# peor que la espera: cortar un `az deployment group create` a mitad deja recursos creados a medias.
concurrency:
  group: azure-deploy
  cancel-in-progress: false

permissions:
  contents: read
  # Lo que la federación de OIDC necesita para pedirle a GitHub el token que Azure valida. Sin esta
  # línea `azure/login` falla con un mensaje que habla de credenciales y no de permisos.
  id-token: write

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest

    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'ukun-demo' }}
      # El respaldo es `francecentral` y no `westeurope`, que sería lo esperable: la suscripción de
      # estudiante tiene una política «Allowed resource deployment regions» que solo admite cinco
      # regiones y esa no está entre ellas. El fallo llega como RequestDisallowedByAzure al crear el
      # PRIMER recurso, no al crear el grupo, así que un default prohibido deja un grupo vacío detrás.
      LOCATION: ${{ vars.AZURE_LOCATION || 'francecentral' }}

    steps:
      - uses: actions/checkout@v7

      # Antes de tocar Azure. Las tres imágenes son paquetes PÚBLICOS de GHCR, así que esto se
      # comprueba sin autenticarse — y comprobarlo aquí convierte el fallo más probable de este
      # workflow (un SHA que nunca llegó a publicarse, o un paquete que sigue privado) en un error de
      # una línea en vez de en tres container apps en ImagePullBackOff, que es un síntoma que no
      # nombra su causa.
      - name: Las tres imágenes existen y se pueden bajar sin credencial
        run: |
          for s in ukun-api ukun-auth ukun-gateway; do
            image="ghcr.io/${{ github.repository_owner }}/$s:${{ inputs.image-tag }}"
            echo "::group::$image"
            docker manifest inspect "$image" > /dev/null
            echo "::endgroup::"
          done

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Idempotente: si el grupo ya existe no pasa nada. Se crea aquí y no en la plantilla para que
      # `main.bicep` sea de ámbito `resourceGroup` y se pueda desplegar a mano contra cualquier grupo.
      - name: Grupo de recursos
        run: az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --output none

      # En qué fase está el dominio, que decide si esta ejecución tiene que emitir el certificado.
      #
      # Azure no deja crear un certificado gestionado para un hostname que todavía no consta en el
      # ingress (`RequireCustomHostnameInEnvironment`), y el binding con certificado no se puede
      # escribir hasta que el certificado existe. Son tres estados y el paso de abajo los recorre en
      # una sola ejecución; esto solo mira en cuál estamos para no repetir trabajo hecho.
      #
      # `|| true` porque la app puede no existir todavía —el primer despliegue del entorno—, y eso
      # no es un fallo: significa que la respuesta es `false`.
      - name: En qué fase está el dominio propio
        id: dominio
        env:
          HOST: ${{ vars.UKUN_GATEWAY_HOST }}
        run: |
          READY=false
          if [ -n "$HOST" ]; then
            BIND=$(az containerapp show -n ukun-gateway -g "$RESOURCE_GROUP" \
                     --query "properties.configuration.ingress.customDomains[?name=='$HOST'].bindingType | [0]" \
                     -o tsv 2>/dev/null || true)
            [ "$BIND" = "SniEnabled" ] && READY=true
            echo "Hostname $HOST — binding actual: ${BIND:-ninguno}. Certificado listo: $READY"
          else
            echo "Sin UKUN_GATEWAY_HOST: no hay dominio propio que preparar."
          fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"

      # El despliegue entero, y de él salen las URLs. `UKUN_AUTH_ISSUER` no se escribe en ninguna
      # parte: la plantilla lo compone desde el `defaultDomain` del entorno, porque el FQDN cambia
      # con el nombre del entorno y el `iss` se compara literalmente contra el claim del token en
      # ukun-api.
      #
      # La excepción es `UKUN_GATEWAY_HOST`, y es una variable y no un secreto porque un nombre de
      # dominio no autoriza nada. Sin definir —el caso por defecto, y el obligatorio la PRIMERA vez—
      # se pasa como cadena vacía y la plantilla se comporta igual que antes de que esto existiera.
      - name: Desplegar
        id: deployment
        env:
          HOST: ${{ vars.UKUN_GATEWAY_HOST }}
          READY: ${{ steps.dominio.outputs.ready }}
        run: |
          desplegar() {
            echo "::group::az deployment group create (certificateReady=$1)"
            az deployment group create \
              --resource-group "$RESOURCE_GROUP" \
              --name "ukun-$(date +%Y%m%d%H%M%S)" \
              --template-file deploy/azure/main.bicep \
              --parameters \
                imageTag='${{ inputs.image-tag }}' \
                registry='ghcr.io/${{ github.repository_owner }}' \
                postgresPassword='${{ secrets.POSTGRES_PASSWORD }}' \
                oauth2GatewaySecret='${{ secrets.UKUN_OAUTH2_GATEWAY_SECRET }}' \
                oauth2ApiSecret='${{ secrets.UKUN_OAUTH2_API_SECRET }}' \
                signingKey='${{ secrets.UKUN_SIGNING_KEY }}' \
                gatewayHost="$HOST" \
                certificateReady="$1" \
              --query properties.outputs \
              --output json > outputs.json
            echo "::endgroup::"
          }

          desplegar "$READY"

          # La segunda fase, y solo la primera vez que se pone el dominio: ahora el hostname ya consta
          # en el ingress, así que Azure acepta emitir el certificado y atarlo por SNI. Emitirlo tarda
          # unos minutos y `az` espera. En las ejecuciones siguientes `READY` ya es `true` y esto no
          # corre — el certificado existe y volver a declararlo es idempotente.
          if [ -n "$HOST" ] && [ "$READY" != "true" ]; then
            echo "El hostname ya está en el ingress. Segunda pasada para emitir el certificado."
            desplegar true
          fi

          {
            echo "gateway-url=$(jq -r .gatewayUrl.value outputs.json)"
            echo "auth-url=$(jq -r .authUrl.value outputs.json)"
            echo "static-ip=$(jq -r .environmentStaticIp.value outputs.json)"
            echo "storage-account=$(jq -r .storageAccountName.value outputs.json)"
            echo "postgres-server=$(jq -r .postgresServerName.value outputs.json)"
            echo "gateway-fqdn=$(jq -r .gatewayFqdn.value outputs.json)"
            echo "domain-verification-id=$(jq -r .customDomainVerificationId.value outputs.json)"
          } >> "$GITHUB_OUTPUT"

      # Las fotos de producto, al share que ukun-api monta en /opt/resources/uploads.
      #
      # No van dentro de ninguna imagen y no es un descuido: `product.image_key` es una clave de
      # almacenamiento, no una ruta (docs/08 §5), y el adaptador de `FileStoragePort` la resuelve
      # contra un directorio que en v1.1 pasa a ser un bucket (issue #57). Meterlas en la imagen del
      # API las volvería inmutables y haría de la subida de RF-10 una excepción al mismo mecanismo.
      #
      # Son las 24 de `resources/uploads`, que es exactamente el conjunto al que apuntan las
      # `image_key` de los 100 productos del changelog demo — cada tipo reutiliza las suyas. Sin este
      # paso el catálogo se pinta entero y cada ficha da un 404 en su foto.
      #
      # `upload-batch` sobreescribe, así que redesplegar no duplica nada. Y va después del
      # despliegue porque el share no existe hasta que la plantilla lo crea; no hace falta reiniciar
      # nada después, porque el adaptador lee del disco en cada petición.
      - name: Subir las fotos de producto al share
        env:
          ACCOUNT: ${{ steps.deployment.outputs.storage-account }}
        run: |
          KEY=$(az storage account keys list --account-name "$ACCOUNT" \
                  --resource-group "$RESOURCE_GROUP" --query '[0].value' -o tsv)
          az storage file upload-batch \
            --account-name "$ACCOUNT" --account-key "$KEY" \
            --destination uploads --source resources/uploads \
            --no-progress --output none
          echo "Subidas $(find resources/uploads -type f | wc -l) imágenes al share."

      # DOS ESPERAS, y hacen falta las dos. Ésta es la primera: que la revisión nueva de CADA app esté
      # lista, no solo aceptada. `az deployment group create` devuelve control en cuanto ACA acepta la
      # revisión, y por delante quedan el arranque de tres JVM y las migraciones de Liquibase.
      #
      # Sin esta espera, un despliegue que solo cambia una variable de `ukun-api` deja el gateway
      # intacto —y por tanto sano desde el primer segundo—, así que el humo arrancaba mientras la
      # revisión nueva del API todavía estaba subiendo. Pasó: el alta se quedó sin responder y el
      # despliegue se declaró fallido con la plantilla correcta. Comprobar la salud del gateway no
      # dice nada sobre las otras dos apps.
      - name: Esperar a que las tres revisiones estén listas
        run: |
          for app in ukun-api ukun-auth ukun-gateway; do
            echo "::group::$app"
            timeout 300 bash -c "
              until [ \"\$(az containerapp show -n $app -g $RESOURCE_GROUP --query properties.latestRevisionName -o tsv)\" \
                    = \"\$(az containerapp show -n $app -g $RESOURCE_GROUP --query properties.latestReadyRevisionName -o tsv)\" ]; do
                sleep 10
              done"
            az containerapp show -n "$app" -g "$RESOURCE_GROUP" --query '{app:name, revision:properties.latestReadyRevisionName}' -o tsv
            echo "::endgroup::"
          done

      # Y la segunda: que la aplicación responda de verdad. Una revisión lista es un contenedor que
      # pasó su sonda, no necesariamente un stack que sirve — los mismos 300 segundos que espera el
      # trabajo `e2e` de ci.yml, y por el mismo motivo.
      #
      # Y va contra la URL PÚBLICA, que con `UKUN_GATEWAY_HOST` puesta es ya el dominio propio. Eso
      # convierte este paso en la comprobación de que el CNAME resuelve y el certificado sirve, sin
      # necesidad de un paso aparte que lo mire — pero también hace que un DNS mal puesto se
      # manifieste aquí como un timeout mudo, así que el fallo dice dónde mirar.
      - name: Esperar a que el gateway esté sano
        env:
          GATEWAY: ${{ steps.deployment.outputs.gateway-url }}
        run: |
          if ! timeout 300 bash -c \
            'until curl -sf "$GATEWAY/actuator/health" | grep -q "\"status\":\"UP\""; do sleep 10; done'; then
            echo "::error::$GATEWAY no responde UP en 300 s."
            if [ -n "${{ vars.UKUN_GATEWAY_HOST }}" ]; then
              echo "::error::Esa URL es el dominio propio. Comprueba en Cloudflare que el CNAME de ${{ vars.UKUN_GATEWAY_HOST }} apunta a ${{ steps.deployment.outputs.gateway-fqdn }} y que el proxy está DESACTIVADO (nube gris). El FQDN de Azure sigue sirviendo la aplicación mientras tanto."
            fi
            exit 1
          fi

      # El firewall deja de estar abierto a los servicios de Azure. Va aquí y no en la plantilla por la
      # dependencia circular que la propia plantilla comenta: la IP saliente no se conoce hasta que
      # las apps existen, y las apps no arrancan sin base.
      #
      # POR QUÉ NO BASTA LA REGLA DE ARRANQUE: el 0.0.0.0 de Flexible Server significa «cualquier
      # recurso dentro de Azure», de cualquier suscripción — y los runners de GitHub Actions corren
      # en Azure, así que la base era alcanzable desde cualquiera de ellos. El paso lo comprueba al
      # final en vez de afirmarlo.
      #
      # `outboundIpAddresses`, no `staticIp` del entorno: son direcciones DISTINTAS y la segunda es
      # la de entrada. Se leen las tres apps y se ordenan únicas porque hoy comparten una sola IP,
      # pero nada garantiza que siga siendo así.
      #
      # Y el aviso que va con esto: en un entorno Consumption sin VNet, Azure no garantiza que esa IP
      # saliente sea estable. Si cambia en caliente, las tres apps pierden la base hasta el siguiente
      # despliegue, que vuelve a estrechar sobre la nueva. La salida robusta es la integración con
      # VNet, que no cuesta dinero pero sí complejidad — está razonada en docs/15-despliegue.md §7.
      - name: Estrechar el firewall de Postgres
        env:
          SERVER: ${{ steps.deployment.outputs.postgres-server }}
          SUB: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          BASE="https://management.azure.com/subscriptions/$SUB/resourceGroups/$RESOURCE_GROUP"
          BASE="$BASE/providers/Microsoft.DBforPostgreSQL/flexibleServers/$SERVER/firewallRules"

          # `outboundIpAddresses` y NO `staticIp` del entorno: son direcciones distintas y la segunda
          # es la de ENTRADA. Comprobado sobre un entorno real: 51.11.234.46 frente a 20.74.0.153.
          # Se leen las tres apps y se ordenan únicas porque hoy comparten una sola, pero nada
          # garantiza que siga siendo así.
          IPS=$(for app in ukun-api ukun-auth ukun-gateway; do
                  az containerapp show -n "$app" -g "$RESOURCE_GROUP" \
                    --query 'properties.outboundIpAddresses' -o tsv
                done | tr -d '\r' | sort -u)

          if [ -z "$IPS" ]; then
            echo "::error::Ninguna app declara outboundIpAddresses. No se toca el firewall: quedarse sin regla dejaría la base inalcanzable."
            exit 1
          fi

          # La API REST y no `az postgres flexible-server firewall-rule`, que no es por gusto: ese
          # comando cambia `--name` de significado y retira `--rule-name` en la versión 2.86 de la
          # CLI, así que la sintaxis que funciona en una máquina rompe en un runner más nuevo. La API
          # no se mueve.
          for ip in $IPS; do
            echo "Autorizando $ip"
            az rest --method put \
              --url "$BASE/aca-outbound-$(echo "$ip" | tr . -)?api-version=2024-08-01" \
              --body "{\"properties\":{\"startIpAddress\":\"$ip\",\"endIpAddress\":\"$ip\"}}" \
              --output none
          done

          # Y fuera la regla de arranque. El borrado es ASÍNCRONO —ARM responde 202 y `az rest` no
          # espera—, así que comprobar el acceso justo después daría un falso negativo.
          az rest --method delete --url "$BASE/AllowAzureServices?api-version=2024-08-01" --output none
          timeout 180 bash -c \
            "until ! az rest --method get --url '$BASE?api-version=2024-08-01' | grep -q AllowAzureServices; do sleep 10; done"

          # La comprobación que convierte esto en verificación y no en intención: este runner corre en
          # Azure, así que la regla de arranque le daba acceso al 5432. Si sigue alcanzándolo, el
          # estrechamiento no ha servido de nada y hay que enterarse aquí.
          FQDN=$(az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$SERVER" \
                   --query fullyQualifiedDomainName -o tsv)
          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/$FQDN/5432" 2>/dev/null; then
            echo "::error::Este runner todavía alcanza $FQDN:5432 tras estrechar el firewall."
            exit 1
          fi
          echo "Comprobado: el 5432 ya no es alcanzable desde fuera de las apps."

      # Humo mínimo, y cada una de las tres comprueba algo que las otras no. Lo que este workflow no
      # puede validar es el recorrido de login → catálogo → carrito → pedido, que es la condición de
      # salida del issue #55: eso se hace a mano contra la URL de abajo.
      - name: Humo
        env:
          GATEWAY: ${{ steps.deployment.outputs.gateway-url }}
          AUTH: ${{ steps.deployment.outputs.auth-url }}
        run: |
          set -e
          # El SPA que sirve la propia imagen del gateway (skill `spring-gateway` §6).
          curl -sf -H 'Accept: text/html' "$GATEWAY/" | grep -q '<div id="root"'
          # La ruta hacia ukun-api por su FQDN interno, que es la traducción que compose.yaml no
          # necesitaba hacer. Anónimo a propósito: el catálogo es público (docs/08 §4).
          curl -sf "$GATEWAY/api/products?page=0&size=1" > /dev/null
          # El documento de descubrimiento, que es lo que dice si el `iss` quedó bien compuesto.
          test "$(curl -sf "$AUTH/.well-known/openid-configuration" | jq -r .issuer)" = "$AUTH"
          # Una foto de producto, que recorre entera la cadena que nada más prueba: el share de Azure
          # Files montado, sus permisos de uid/gid, y la ruta /media/** que el gateway enruta hacia el
          # módulo `storage` de ukun-api (ADR-0017 §1). `mesa-madera.jpg` es la del primer producto
          # del changelog demo.
          test "$(curl -sf -o /dev/null -w '%{content_type}' "$GATEWAY/media/products/mesa-madera.jpg")" = "image/jpeg"

          # Y un alta de cliente de verdad, que es el ÚNICO camino que hace hablar a ukun-api con
          # ukun-auth: la saga de signup llama a /internal/accounts con client_credentials (docs/08
          # §3). Las cuatro comprobaciones de arriba pasaban con esa llamada apuntando a un host que
          # no existe, porque ninguna la ejercita — un despliegue en verde con el alta rota es lo que
          # este paso existe para impedir.
          #
          # Deja una cuenta por despliegue en un entorno cuyos datos son desechables (ADR-0007), y el
          # dominio es `example.com`, reservado por la RFC 2606 justamente para esto. El límite de
          # `/api/signup` —5 cada 10 minutos por IP— no molesta aquí: cada ejecución sale de un runner
          # distinto.
          JAR=$(mktemp)
          curl -sf -c "$JAR" -o /dev/null "$GATEWAY/"
          XSRF=$(awk '/XSRF-TOKEN/ {print $NF}' "$JAR")
          SIGNUP=$(curl -s -m 60 -b "$JAR" -o /dev/null -w '%{http_code}' -X POST "$GATEWAY/api/signup" \
            -H 'Content-Type: application/json' -H "X-XSRF-TOKEN: $XSRF" \
            -d "{\"email\":\"smoke-$(date +%s)@example.com\",
                 \"password\":\"humo del despliegue 2026\",
                 \"name\":\"Humo\",\"lastName\":\"Despliegue\",
                 \"address\":{\"street\":\"Calle Mayor, 1\",\"city\":\"Alcala\",
                              \"province\":\"Madrid\",\"postalCode\":\"28801\"},
                 \"card\":{\"last4\":\"4242\",\"brand\":\"VISA\",\"expMonth\":9,\"expYear\":2028}}")
          if [ "$SIGNUP" != "201" ]; then
            echo "::error::El alta de cliente respondió $SIGNUP en vez de 201. Si no responde nada, mira UKUN_AUTH_BASE_URL: es contra quien ukun-api llama a /internal/accounts."
            exit 1
          fi

      - name: Resumen
        env:
          HOST: ${{ vars.UKUN_GATEWAY_HOST }}
          FQDN: ${{ steps.deployment.outputs.gateway-fqdn }}
          ASUID: ${{ steps.deployment.outputs.domain-verification-id }}
        run: |
          {
            echo "## Entorno desplegado"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Aplicación | ${{ steps.deployment.outputs.gateway-url }} |"
            echo "| Authorization Server | ${{ steps.deployment.outputs.auth-url }} |"
            echo "| Imágenes | \`${{ inputs.image-tag }}\` |"
            echo "| Grupo de recursos | \`$RESOURCE_GROUP\` |"
            echo "| IP estática del entorno | \`${{ steps.deployment.outputs.static-ip }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Los registros de Cloudflare, ya rellenos. Se imprimen SIEMPRE y no sólo la primera vez:
          # con la variable puesta sirven para comprobar que lo que hay en Cloudflare sigue siendo
          # correcto, que es la pregunta que se hace cuando el dominio deja de responder.
          {
            echo
            echo "### Dominio propio"
            echo
            if [ -z "$HOST" ]; then
              echo "\`UKUN_GATEWAY_HOST\` no está definida: el entorno se sirve sólo por su FQDN de Azure."
              echo "Para ponerle tu subdominio, crea estos dos registros en Cloudflare **con el proxy"
              echo "desactivado (nube gris)** y define después la variable:"
            else
              echo "Servido por \`$HOST\`. Estos son los registros que lo sostienen, para cotejarlos"
              echo "con lo que haya en Cloudflare si el dominio deja de resolver:"
            fi
            echo
            echo "| Tipo | Nombre | Contenido | Proxy |"
            echo "|---|---|---|---|"
            echo "| CNAME | \`${HOST:-<tu-subdominio>}\` | \`$FQDN\` | DNS only |"
            echo "| TXT | \`asuid.${HOST:-<tu-subdominio>}\` | \`$ASUID\` | — |"
            echo
            echo "El CNAME apunta al \`defaultDomain\` del entorno, que \`teardown.yml\` **conserva**:"
            echo "una vez escrito no hay que volver a tocarlo aunque se destruya y se levante el resto."
            echo
            echo "La pantalla de contraseña se sirve desde \`ukun-auth\`, que se queda con su FQDN de"
            echo "Azure: durante el login se ve esa URL y no el dominio propio. Es esperado."
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo
            echo "La regla de firewall de Postgres está abierta a los servicios de Azure. Para"
            echo "estrecharla a este entorno, ver \`docs/15-despliegue.md\`."
            echo
            echo "**Acuérdate de \`teardown.yml\` cuando termines la demo:** el crédito de estudiante"
            echo "se agota solo si esto se queda encendido."
          } >> "$GITHUB_STEP_SUMMARY"
