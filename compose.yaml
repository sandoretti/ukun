services:
  db:
    image: postgres:17
    restart: always
    shm_size: 128mb
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"

  ukun-api:
    image: ukun/api:dev
    build:
      # El contexto es la raíz del repo, no el directorio del servicio: el Dockerfile de producción
      # copia gradlew, settings.gradle.kts y buildSrc/, que viven ahí.
      context: .
      dockerfile: services/ukun-api/Dockerfile
    ports:
      - "${API_PORT:-8081}:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      # Las fotos de producto, que el módulo `storage` sirve bajo /media/products/** (ADR-0017,
      # docs/08 §9). Es el bind mount que docs/01-arquitectura.md ya dibuja, y desaparece en v1.1
      # cuando el adaptador pase a almacenamiento de objetos.
      #
      # `:ro` porque hoy solo se lee: la subida de RF-10 llega en v0.7 y es quien tiene que quitarlo.
      - ./resources/uploads:/opt/resources/uploads:ro
    depends_on:
      - db

  ukun-auth:
    image: ukun/auth:dev
    build:
      # El contexto es la raíz del repo, no el directorio del servicio: el Dockerfile de producción
      # copia gradlew, settings.gradle.kts y buildSrc/, que viven ahí.
      context: .
      dockerfile: services/ukun-auth/Dockerfile
    ports:
      - "${AUTH_PORT:-9000}:9000"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/ukun_auth
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - db

  ukun-gateway:
    image: ukun/gateway:dev
    build:
      # El contexto es la raíz del repo, no el directorio del servicio: el Dockerfile de producción
      # copia gradlew, settings.gradle.kts y buildSrc/, que viven ahí.
      context: .
      dockerfile: services/ukun-gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - ukun-api
      - ukun-auth

  ukun-web:
    image: ukun/web:dev
    build:
      context: ./apps/ukun-web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  db_data:
