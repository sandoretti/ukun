services:
  db:
    image: postgres:17
    restart: always
    shm_size: 128mb
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  ukun-api:
    image: ukun/api:dev
    build:
      context: ./services/ukun-api
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - db

  ukun-auth:
    image: ukun/auth:dev
    build:
      context: ./services/ukun-auth
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/ukun_auth
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - db

  ukun-gateway:
    image: ukun/gateway:dev
    build:
      context: ./services/ukun-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - ukun-api
      - ukun-auth

  ukun-web:
    image: ukun/web:dev
    build:
      context: ./apps/ukun-web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"

volumes:
  db_data:
