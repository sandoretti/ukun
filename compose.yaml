# La rotación de logs que pide docs/11-observabilidad-y-logging.md §7: la aplicación escribe a stdout
# y nunca a fichero (`logging.file.name` sin usar), así que rotar es responsabilidad del runtime. Con
# el formato ECS de v1.0 cada línea es un JSON bastante más largo que el patrón legible, y sin esto el
# único riesgo real —que un log llene el disco de la máquina de desarrollo— crece en vez de bajar.
x-log-rotation: &log-rotation
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:17
    restart: always
    logging: *log-rotation
    shm_size: 128mb
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"

  ukun-api:
    image: ukun/api:dev
    logging: *log-rotation
    build:
      # El contexto es la raíz del repo, no el directorio del servicio: el Dockerfile de producción
      # copia gradlew, settings.gradle.kts y buildSrc/, que viven ahí.
      context: .
      dockerfile: services/ukun-api/Dockerfile
    ports:
      - "${API_PORT:-8081}:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      # El mismo `iss` que emite ukun-auth, y por eso el mismo valor y el mismo default: aquí se
      # compara literalmente contra el claim del token. Si los dos se desalinean, el síntoma es un
      # 401 en este servicio y la causa está en el de al lado.
      - UKUN_AUTH_ISSUER=${UKUN_AUTH_ISSUER:-http://localhost:${AUTH_PORT:-9000}}
      # Estas dos, en cambio, van por el nombre interno del contenedor: no las resuelve ningún
      # navegador, las resuelve este servicio desde dentro de la red de Docker.
      - UKUN_AUTH_JWK_SET_URI=${UKUN_AUTH_JWK_SET_URI:-http://ukun-auth:9000/oauth2/jwks}
      - UKUN_AUTH_TOKEN_URI=${UKUN_AUTH_TOKEN_URI:-http://ukun-auth:9000/oauth2/token}
      # El secreto del cliente `ukun-api` registrado en ukun-auth: el mismo valor a los dos lados
      # (.env, ver .env.example). Sin él, AccountsPort no puede pedir su token.
      - UKUN_OAUTH2_API_SECRET=${UKUN_OAUTH2_API_SECRET}
    volumes:
      # Las fotos de producto, que el módulo `storage` sirve bajo /media/products/** (ADR-0017,
      # docs/08 §9). Es el bind mount que docs/01-arquitectura.md ya dibuja, y desaparece en v1.1
      # cuando el adaptador pase a almacenamiento de objetos.
      #
      # Sin `:ro` desde v0.7: la subida de RF-10 (`PUT /api/admin/products/{id}/image`) escribe aquí,
      # y el adaptador de filesystem crea el directorio si no existe.
      - ./resources/uploads:/opt/resources/uploads
    depends_on:
      - db

  ukun-auth:
    image: ukun/auth:dev
    logging: *log-rotation
    build:
      # El contexto es la raíz del repo, no el directorio del servicio: el Dockerfile de producción
      # copia gradlew, settings.gradle.kts y buildSrc/, que viven ahí.
      context: .
      dockerfile: services/ukun-auth/Dockerfile
    ports:
      - "${AUTH_PORT:-9000}:9000"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/ukun_auth
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      # El `iss` del token. Es localhost y no ukun-auth:9000 porque el navegador tiene que poder
      # seguir la redirección a /oauth2/authorize, y quien valida `iss` compara literalmente con
      # esta cadena: si aquí pusiera el nombre interno del contenedor, el login del navegador
      # apuntaría a un host que no existe fuera de la red de Docker.
      - UKUN_AUTH_ISSUER=${UKUN_AUTH_ISSUER:-http://localhost:${AUTH_PORT:-9000}}
      - UKUN_GATEWAY_BASE_URL=${UKUN_GATEWAY_BASE_URL:-http://localhost:${GATEWAY_PORT:-8080}}
      # Sin valor por defecto: .env los define (ver .env.example) y sin ellos el servicio no arranca,
      # que es justo lo que se quiere frente a un secreto de cliente conocido.
      - UKUN_OAUTH2_GATEWAY_SECRET=${UKUN_OAUTH2_GATEWAY_SECRET}
      - UKUN_OAUTH2_API_SECRET=${UKUN_OAUTH2_API_SECRET}
    depends_on:
      - db

  ukun-gateway:
    image: ukun/gateway:dev
    logging: *log-rotation
    build:
      # El contexto es la raíz del repo, no el directorio del servicio: el Dockerfile de producción
      # copia gradlew, settings.gradle.kts y buildSrc/, que viven ahí.
      context: .
      dockerfile: services/ukun-gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      # Los tres destinos que este servicio enruta, por nombre de contenedor: los resuelve el
      # gateway desde dentro de la red de Docker, nunca el navegador — es la misma distinción que
      # separa UKUN_AUTH_JWK_SET_URI de UKUN_AUTH_ISSUER en ukun-api.
      - UKUN_API_URI=${UKUN_API_URI:-http://ukun-api:8081}
      - UKUN_AUTH_URI=${UKUN_AUTH_URI:-http://ukun-auth:9000}
      # El dev server de Vite, al que solo enruta el perfil dev (compose.dev.yaml).
      - UKUN_WEB_URI=${UKUN_WEB_URI:-http://ukun-web:5173}

      # A partir del BFF (issue #28) este servicio SÍ maneja valores que el navegador tiene que ver,
      # y son otro juego de variables. Las dos de arriba las sigue el navegador: el issuer (que es
      # también el `iss` que ukun-api valida) y, derivado de él, el authorization endpoint al que se
      # redirige para teclear la contraseña. Las dos de abajo las pide el propio gateway desde la red
      # de Docker. Mezclarlas es el fallo que no da un error claro: o el navegador no alcanza el
      # login, o el arranque no alcanza las claves.
      - UKUN_AUTH_ISSUER=${UKUN_AUTH_ISSUER:-http://localhost:${AUTH_PORT:-9000}}
      - UKUN_GATEWAY_BASE_URL=${UKUN_GATEWAY_BASE_URL:-http://localhost:${GATEWAY_PORT:-8080}}
      - UKUN_AUTH_TOKEN_URI=${UKUN_AUTH_TOKEN_URI:-http://ukun-auth:9000/oauth2/token}
      - UKUN_AUTH_JWK_SET_URI=${UKUN_AUTH_JWK_SET_URI:-http://ukun-auth:9000/oauth2/jwks}
      # El mismo secreto con el que ukun-auth registró el cliente, y por eso sin default: si falta,
      # la propiedad sin default de application.yaml impide arrancar con un mensaje que lo dice.
      - UKUN_OAUTH2_GATEWAY_SECRET=${UKUN_OAUTH2_GATEWAY_SECRET}
    depends_on:
      - ukun-api
      - ukun-auth

  ukun-web:
    image: ukun/web:dev
    logging: *log-rotation
    build:
      context: ./apps/ukun-web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  db_data:
