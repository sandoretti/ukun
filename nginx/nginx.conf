# nginx/nginx.conf
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  server {
    listen 80;
    client_max_body_size 12m;

    # El `location /` enrutaba a ukun-clientes:8081, borrado en v0.6 tras declarar la paridad del
    # recorrido de cliente (docs/04-roadmap.md). Este fichero se va entero con ukun-empleados en v0.7.
    location /empleados {
      proxy_pass http://ukun-empleados:8082;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
